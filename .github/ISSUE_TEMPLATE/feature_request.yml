name: Feature request
description: Suggest an improvement or new feature for SoftSpoken
title: "[Suggestion] "
body:
  - type: markdown
    attributes:
      value: |
        Ideas and feedback are welcome! SoftSpoken is currently maintainer-led, so this form is for suggestions rather than implementation assignments.
  - type: dropdown
    id: module
    attributes:
      label: Related module
      options:
        - Core / narration player / Compendium
        - Stories
        - Places
        - Writings
        - Voice packs / installation
        - New module or general idea
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What would you like to see?
      description: Describe the proposed feature or improvement.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why would this be useful?
      description: A gameplay situation, problem, or example can help explain the idea.
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Optional sketches, screenshots, references, or other context.
    validations:
      required: false
