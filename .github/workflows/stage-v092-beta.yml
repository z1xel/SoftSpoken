name: Stage SoftSpoken v0.9.2-beta

# Builds a private-to-Actions candidate ZIP; does NOT publish a GitHub release.
on:
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "README.md"
      - "SoftSpoken/**"
      - "SoftSpoken_Stories/**"
      - "SoftSpoken_Places/**"
      - "SoftSpoken_Writings/**"
      - "tests/**"
      - "docs/releases/v0.9.2-beta.md"
      - ".github/workflows/stage-v092-beta.yml"
  workflow_dispatch:

concurrency:
  group: stage-v092-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    name: Validate and package v0.9.2-beta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version consistency and installable file structure
        run: |
          python3 tests/test_release_version.py
          python3 tests/test_public_contracts.py
          python3 tests/test_ui_packaging.py
          python3 tests/test_texture_path_integrity.py
      - name: Validate quest catalog and static POI regressions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          lua5.1 tests/catalog_release_gate.lua
          lua5.1 tests/places_static_poi_main.lua
          lua5.1 tests/places_map_hover.lua
          lua5.1 tests/places_overlay_ownership.lua
      - name: Build installable ZIP without development files
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          modules = ("SoftSpoken", "SoftSpoken_Stories", "SoftSpoken_Places", "SoftSpoken_Writings")
          version = pathlib.Path("VERSION").read_text().strip()
          assert version == "v0.9.2-beta", version
          package = pathlib.Path("dist") / ("SoftSpoken-" + version + ".zip")
          package.parent.mkdir(exist_ok=True)
          files = sorted(p for mod in modules for p in pathlib.Path(mod).rglob("*") if p.is_file())
          assert files
          with zipfile.ZipFile(package, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for file in files:
                  assert not file.is_symlink()
                  z.write(file, file.as_posix())
          with zipfile.ZipFile(package) as z:
              assert z.testzip() is None
              for mod in modules:
                  toc = f"{mod}/{mod}.toc"
                  assert f"## Version: {version}".encode() in z.read(toc)
          print(f"Staged {package} ({len(files)} files, {package.stat().st_size:,} bytes)")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SoftSpoken-v0.9.2-beta-preview
          path: dist/SoftSpoken-v0.9.2-beta.zip
          compression-level: 0
