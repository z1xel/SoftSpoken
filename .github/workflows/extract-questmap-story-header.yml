name: Extract original brown header band from QuestMapLogAtlas

on:
  push:
    branches:
      - experiment/vanilla-ui-fidelity
    paths:
      - ".github/workflows/extract-questmap-story-header.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cut exact source pixels and produce 1.12 texture
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          curl -fLsS --retry 3 \
            'https://raw.githubusercontent.com/Gethe/wow-ui-textures/d23deaf8f44a7d280dc974a5c9d5321c013db59b/QUESTFRAME/QuestMapLogAtlas.PNG' \
            -o "$RUNNER_TEMP/QuestMapLogAtlas.PNG"
          python3 - <<'PY'
          import hashlib,io,os,pathlib
          from PIL import Image
          payload=(pathlib.Path(os.environ['RUNNER_TEMP'])/'QuestMapLogAtlas.PNG').read_bytes()
          sha=hashlib.sha1(b'blob '+str(len(payload)).encode()+bytes([0])+payload).hexdigest()
          assert sha=='b68f78d2599f386fd6d5055c7ec3aad57491b249',sha
          atlas=Image.open(io.BytesIO(payload)).convert('RGBA')
          assert atlas.size == (1024,1024),atlas.size
          # This is the black-framed, brown inset strip from the source atlas,
          # NOT StoryHeader-BG (which is the dark stone header at y933).
          x0,y0,x1,y1=578,397,838,456
          crop=atlas.crop((x0,y0,x1,y1))
          output=pathlib.Path('SoftSpoken/Compendium/Textures/Prototype/Art')
          output.mkdir(parents=True,exist_ok=True)
          crop.save(output/'QuestMapLogBrownBand_source.png')
          # WoW 1.12 accepts TGA; pad to power-of-two canvas without resampling.
          canvas=Image.new('RGBA',(512,64),(0,0,0,0))
          canvas.paste(crop,(0,0))
          canvas.save(output/'QuestMapLogBrownBand.tga')
          print('Verified source blob:',sha)
          print('Native crop:',crop.size,'source:',(x0,y0,x1,y1),'canvas:',canvas.size)
          PY
      - name: Commit original-source artwork and remove inspection files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch tests/.questmap_atlas_inspection/
          git add SoftSpoken/Compendium/Textures/Prototype/Art/QuestMapLogBrownBand.tga
          git add SoftSpoken/Compendium/Textures/Prototype/Art/QuestMapLogBrownBand_source.png
          git commit -m "assets(compendium): package source-pixel QuestMapLog brown band"
          git push origin HEAD:experiment/vanilla-ui-fidelity
