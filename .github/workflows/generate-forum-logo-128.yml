name: Generate 128px SoftSpoken forum logo
on:
  push:
    branches: [assets/softspoken-forum-logo-128]
    paths:
      - ".github/workflows/generate-forum-logo-128.yml"
permissions:
  contents: write
jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image processor
        run: python3 -m pip install --quiet pillow
      - name: Resize existing GitHub logo
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Path("docs/images/softspoken-icon-320.png")
          out = Path("docs/images/softspoken-icon-128.png")
          with Image.open(src) as image:
              assert image.size == (320, 320), f"Unexpected source image dimensions: {image.size}"
              resized = image.convert("RGBA").resize((128, 128), Image.Resampling.LANCZOS)
              resized.save(out, "PNG", optimize=True)
          with Image.open(out) as image:
              assert image.size == (128, 128)
          print(f"Saved {out} ({out.stat().st_size:,} bytes)")
          PY
      - name: Commit image on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/softspoken-icon-128.png
          if ! git diff --cached --quiet; then
            git commit -m "Add 128px SoftSpoken forum logo"
            git push origin HEAD:assets/softspoken-forum-logo-128
          fi
