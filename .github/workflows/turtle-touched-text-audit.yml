name: Read-only Turtle-touched quest text coverage audit
on:
  push:
    branches: [audit/turtle-touched-text-coverage]
    paths:
      - .github/workflows/turtle-touched-text-audit.yml
      - scripts/audit_turtle_touched_text.py
      - docs/audits/turtle_touched_text_coverage/first_batch_verified_stages.csv
      - docs/audits/turtle_touched_text_coverage/missing_207_verified_stages.csv
      - scripts/import_turtle_touched_text.py
      - scripts/import_turtle_missing_stages.py
      - scripts/import_turtle_tier3_completions.py
      - docs/audits/turtle_touched_text_coverage/tier3_13_completion_manifest.csv
      - docs/audits/turtle_touched_text_coverage/verified_progress_corrections.json
      - scripts/analyze_turtle_conflicting_dialogue.py
      - scripts/review_turtle_substantial_dialogue.py
      - scripts/audit_imported_missing_stage_alignment.py
      - scripts/import_tortoise_quest_dialogue.mjs
      - scripts/prepare_tortoise_quest_overlay.py
      - scripts/export_static_quest_text_for_audit.lua
      - scripts/extract_tortoise_methods.mjs
      - scripts/diff_pfquest_turtle_quests.lua
      - tests/test_turtle_touched_text_audit.py
      - tests/test_import_turtle_touched_text.py
      - tests/test_import_turtle_missing_stages.py
      - tests/test_import_turtle_tier3_completions.py
      - tests/test_turtle_conflict_review.py
      - docs/turtle_verified_live_shared_ids.csv
  workflow_dispatch:
concurrency:
  group: turtle-touched-quest-text-audit
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  touched-text-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - name: Check out isolated audit branch
        uses: actions/checkout@v4

      - name: Get immutable Tortoise SQLite source
        uses: actions/checkout@v4
        with:
          repository: Xian55/tortoise-db-viewer
          ref: 567ce23c73087e9b67fd2d4732c171d751e54bba
          path: .audit-viewer-data
          sparse-checkout: |
            data/tortoise.sqlite.br
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Get pinned world quest SQL and migrations
        uses: actions/checkout@v4
        with:
          repository: tortoise-wow/tortoise-wow
          ref: 48cb227f2cb698920dc2f60eeadd6546243eb75e
          path: .audit-world
          filter: blob:none
          sparse-checkout: |
            sql/base/tw_world_quest_template.sql
            sql/database_updates
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Get Tortoise raw SQL staging parser
        uses: actions/checkout@v4
        with:
          repository: Xian55/tortoise-db-viewer
          ref: 8f90ff8a959e36345530d0a80458f3c50b13e2f0
          path: .audit-viewer
          sparse-checkout: |
            scripts/lib/staging.mjs
            scripts/lib/mysqlexec.mjs
            scripts/lib/sqldump.mjs
            scripts/lib/sqlite.mjs
            package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout pinned Turtle-specific pfQuest metadata overrides
        uses: actions/checkout@v4
        with:
          repository: shagu/pfQuest-turtle
          ref: 0bc7bf4e55d8867a065354da6f386461255e4801
          path: .audit-pfquest
          sparse-checkout: |
            db/quests-turtle.lua
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout pinned Vanilla pfQuest metadata for structural diff
        uses: actions/checkout@v4
        with:
          repository: shagu/pfQuest
          ref: 104f35678ca39ab1fb78b655f815cc7016f5e0c8
          path: .audit-pfquest-vanilla
          sparse-checkout: |
            db/quests.lua
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download and verify the independent Vanilla 1.12 baseline
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-delay 3 \
            https://github.com/cmangos/classic-db/releases/download/latest/classic-sqlite-db.zip \
            -o /tmp/classic-sqlite-db.zip
          echo '78c08a0b8d0e253d8a094ae830942d0a8b3316ad1a1ebba4be57342bc2c3d0d1  /tmp/classic-sqlite-db.zip' | sha256sum -c
          mkdir -p .audit-vanilla
          unzip -q /tmp/classic-sqlite-db.zip -d .audit-vanilla
          find .audit-vanilla -type f -maxdepth 5 | head -30
          python3 - <<'PY'
          import pathlib,sqlite3
          paths=list(pathlib.Path(".audit-vanilla").rglob("*.sqlite"))+list(pathlib.Path(".audit-vanilla").rglob("*.db"))
          verified=[]
          for p in paths:
              try:
                  with sqlite3.connect("file:"+str(p.resolve())+"?mode=ro",uri=True) as db:
                      if db.execute("SELECT name FROM sqlite_master WHERE name='quest_template'").fetchone():
                          verified.append(p)
              except sqlite3.DatabaseError:
                  pass
          if len(verified)!=1:raise SystemExit("Expected precisely one Classic quest_template SQLite, got "+str(verified))
          pathlib.Path(".audit-vanilla-path").write_text(str(verified[0]))
          with sqlite3.connect(str(verified[0])) as db:
              print("Vanilla quest rows:",db.execute("SELECT count(*) FROM quest_template").fetchone()[0])
              print("Vanilla quest fields:",[r[1] for r in db.execute("PRAGMA table_info(quest_template)")][:50])
          PY

      - name: Verify and decompress pinned Turtle source
        run: |
          node -e 'const fs=require("fs"),z=require("zlib"),c=require("crypto");const p=".audit-viewer-data/data/tortoise.sqlite.br";const b=fs.readFileSync(p);const sha=c.createHash("sha1").update(Buffer.from("blob "+b.length+"\0")).update(b).digest("hex");if(sha!=="7b126fce5260502fa40f9f6b67190f920e60a0f6")throw Error("Tortoise pin changed: "+sha);fs.writeFileSync(".audit-viewer-data/data/tortoise.sqlite",z.brotliDecompressSync(b))'

      - name: Install raw SQL staging dependency
        working-directory: .audit-viewer
        run: npm install --omit=dev --no-save --no-package-lock --no-audit --no-fund better-sqlite3@11.8.1

      - name: Recover migration-applied Turtle quest Method/disabled evidence
        run: |
          node scripts/extract_tortoise_methods.mjs
          python3 -c 'import csv; r=list(csv.DictReader(open(".audit-methods.csv"))); assert len(r)>6500; print("Migration-validated Method rows:",len(r))'

      - name: Extract explicit Turtle pfQuest overridden quest IDs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lua5.1
          lua5.1 scripts/diff_pfquest_turtle_quests.lua \
            .audit-pfquest-vanilla/db/quests.lua \
            .audit-pfquest/db/quests-turtle.lua \
            .audit-pfquest-overrides.csv \
            .audit-pfquest-vanilla-ids.csv
          python3 - <<'PY'
          import csv
          migration=list(csv.DictReader(open(".audit-migration-text-changes.csv")))
          print("Tortoise SQL migration text changes:",len(migration))
          PY

      - name: Compare ONLY changed and restored shared-ID quest text
        run: |
          python3 scripts/audit_turtle_touched_text.py \
            --turtle .audit-viewer-data/data/tortoise.sqlite \
            --vanilla "$(cat .audit-vanilla-path)" \
            --methods .audit-methods.csv \
            --vanilla-pfquest-ids .audit-pfquest-vanilla-ids.csv \
            --pfquest-overrides .audit-pfquest-overrides.csv \
            --turtle-migrations .audit-migration-text-changes.csv
          python3 - <<'PY'
          import csv
          p="docs/audits/turtle_touched_text_coverage/review_scoped_quests.csv"
          with open(p,newline="",encoding="utf-8") as f: rows=list(csv.DictReader(f))
          with open(".audit-scoped-quest-ids","w") as f:
              for r in rows:f.write(r["quest_id"]+"\n")
          print("Turtle-touched review candidate IDs:",len(rows))
          PY
          # All dialogue bytes exist only in this ephemeral CI working tree.
          lua5.1 scripts/export_static_quest_text_for_audit.lua \
            .audit-scoped-quest-ids .audit-static-text-hex.tsv
          python3 scripts/audit_turtle_touched_text.py \
            --turtle .audit-viewer-data/data/tortoise.sqlite \
            --vanilla "$(cat .audit-vanilla-path)" \
            --methods .audit-methods.csv \
            --vanilla-pfquest-ids .audit-pfquest-vanilla-ids.csv \
            --pfquest-overrides .audit-pfquest-overrides.csv \
            --turtle-migrations .audit-migration-text-changes.csv \
            --lua-stages .audit-static-text-hex.tsv
          rm -f .audit-static-text-hex.tsv .audit-scoped-quest-ids
          # Keep pinned metadata CSVs until the post-import report is regenerated.
          cat docs/audits/turtle_touched_text_coverage/summary.json

      - name: Validate the first restored-quest batch without publishing dialogue
        run: |
          set -euo pipefail
          python3 scripts/import_turtle_touched_text.py \
            --db .audit-viewer-data/data/tortoise.sqlite
          python3 -m unittest discover -s tests -p 'test_import_turtle_touched_text.py'
          python3 scripts/import_turtle_missing_stages.py \
            --db .audit-viewer-data/data/tortoise.sqlite
          python3 -m unittest discover -s tests -p 'test_import_turtle_missing_stages.py'
          python3 scripts/import_turtle_tier3_completions.py \
            --db .audit-viewer-data/data/tortoise.sqlite
          python3 -m unittest discover -s tests -p 'test_import_turtle_tier3_completions.py'
          python3 - <<'PY'
          import csv,json
          p="docs/audits/turtle_touched_text_coverage/"
          with open(p+"directly_supported_text_gaps.csv",newline="",encoding="utf-8") as f:
              rows=list(csv.DictReader(f))
          assert len(rows) in (289,276), f"Expected 289 before Tier 3 import or 276 after, saw {len(rows)}"
          assert all(r["source_migration_modified_stage"]=="1" or (
              r["category"]=="legacy_id_absent_from_vanilla" and
              r["vanilla_pfquest_present"]=="0") for r in rows)
          print(f"Strict stage-scoped audit: {len(rows)} remaining candidates; first batch: 13 pinned stage hashes")
          PY
          git diff --exit-code -- SoftSpoken_Stories/Data/QuestText.lua \
            SoftSpoken_Stories/Data/TurtleQuestText.lua

      - name: Smoke-test the one-command local combined import, then restore corpus
        shell: bash
        run: |
          set -euo pipefail
          trap 'git restore -- SoftSpoken_Stories/Data/TurtleQuestText.lua' EXIT
          # Preserve all existing exclusive and first-batch text. The 207
          # generated region is intentionally repaired, then 13 Tier 3
          # completion-only overrides are added as a separate block.
          node scripts/import_tortoise_quest_dialogue.mjs \
            --touched-only --source-sqlite .audit-viewer-data/data/tortoise.sqlite
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          path="SoftSpoken_Stories/Data/TurtleQuestText.lua"
          old=subprocess.check_output(["git","show","HEAD:"+path])
          new=Path(path).read_bytes()
          marker=b"-- BEGIN Turtle-touched missing 207 dialogue stages"
          assert old.split(marker,1)[0] == new.split(marker,1)[0], "Existing exclusive or restored text changed"
          assert new.count(b"-- BEGIN Turtle-touched first batch")==1
          assert new.count(marker)==1
          assert new.count(b"-- BEGIN verified Tier 3 completion dialogue")==1
          print("Existing exclusive and first restored quest stages preserved; 207 region and Tier 3 verified")
          PY
          luac5.1 -p SoftSpoken_Stories/Data/TurtleQuestText.lua
          lua5.1 - <<'LUA'
          dofile("SoftSpoken_Stories/Data/TurtleQuestText.lua")
          local exclusive, touched = 0, 0
          for id in pairs(SSCTurtleQuestText) do
              if id >= 20000 then exclusive = exclusive + 1
              else touched = touched + 1 end
          end
          assert(exclusive == 2369, "exclusive rows changed: "..exclusive)
          assert(touched == 223, "shared-ID quest count changed: "..touched)
          assert(SSCTurtleQuestText[820].accept and SSCTurtleQuestText[820].progress and
                 SSCTurtleQuestText[820].complete)
          assert(SSCTurtleQuestText[3111].accept and not SSCTurtleQuestText[3111].progress and
                 not SSCTurtleQuestText[3111].complete)
          for _, id in ipairs({3578,3579,3580}) do
              assert(SSCTurtleQuestText[id].accept and SSCTurtleQuestText[id].progress and
                     SSCTurtleQuestText[id].complete)
          end
          assert(SSCTurtleQuestText[38].progress and SSCTurtleQuestText[9422].progress)
          for _, id in ipairs({9034,9043,9046,9057,9077,9095,9096,9097,9098,9099,9100,9101,9102}) do
              assert(SSCTurtleQuestText[id] and SSCTurtleQuestText[id].complete)
          end
          assert(string.find(SSCTurtleQuestText[6283].progress,"Bloodfury Ripper",1,true))
          assert(string.find(SSCTurtleQuestText[8051].progress,"Gurubashi",1,true))
          assert(string.find(SSCTurtleQuestText[8146].progress,"smell you again",1,true))
          print("Combined local Lua import: 2369 exclusive, 13 restored, 207 repaired/missing, 13 Tier 3")
          LUA
          git restore -- SoftSpoken_Stories/Data/TurtleQuestText.lua
          # Full pinned regeneration is also still supported and produces
          # exactly the same high-ID and targeted low-ID quest set.
          node scripts/import_tortoise_quest_dialogue.mjs \
            --source-sqlite .audit-viewer-data/data/tortoise.sqlite
          luac5.1 -p SoftSpoken_Stories/Data/TurtleQuestText.lua
          lua5.1 - <<'LUA'
          dofile("SoftSpoken_Stories/Data/TurtleQuestText.lua")
          local high, low = 0, 0
          for id in pairs(SSCTurtleQuestText) do
              if id >= 20000 then high = high + 1
              else low = low + 1 end
          end
          assert(high == 2369 and low == 223)
          assert(SSCTurtleQuestText[38].progress)
          assert(SSCTurtleQuestText[9034].complete)
          assert(string.find(SSCTurtleQuestText[6283].progress,"Bloodfury Ripper",1,true))
          print("Full pinned regeneration: 2369 exclusive quests plus 223 shared-ID quests")
          LUA
          git restore -- SoftSpoken_Stories/Data/TurtleQuestText.lua
          git diff --exit-code -- SoftSpoken_Stories/Data/TurtleQuestText.lua \
            SoftSpoken_Stories/Data/QuestText.lua

      - name: Verify no static text, catalog, or Vanilla source was changed
        run: |
          python3 -m unittest discover -s tests -p 'test_turtle_touched_text_audit.py'
          git diff --exit-code -- SoftSpoken_Stories/Data/QuestText.lua \
            SoftSpoken_Stories/Data/TurtleQuestText.lua \
            SoftSpoken_Stories/Data/Compendium.lua
          python3 - <<'PY'
          import csv,json
          p="docs/audits/turtle_touched_text_coverage/"
          s=json.load(open(p+"summary.json"))
          assert s["review_candidates"]>0, "Audit unexpectedly selected no changed quests"
          assert s["reviewed_stages"]==3*s["review_candidates"]
          with open(p+"review_scoped_quests.csv",newline="") as f:
              r=list(csv.DictReader(f))
          assert all(int(row["quest_id"])<20000 or row["category"]!="legacy_id_absent_from_vanilla" for row in r)
          print("Read-only quest text audit assertions passed")
          PY

      - name: Upload only text-free review reports
        uses: actions/upload-artifact@v4
        with:
          name: turtle-touched-quest-text-coverage
          path: docs/audits/turtle_touched_text_coverage/
          retention-days: 30

      - name: Commit verified Turtle dialogue into existing table
        run: |
          # Source SHA checks passed: repair three imported progress stages
          # and add only the 13 adjudicated Tier 3 completion overrides.
          node scripts/import_tortoise_quest_dialogue.mjs \
            --touched-only --source-sqlite .audit-viewer-data/data/tortoise.sqlite
          luac5.1 -p SoftSpoken_Stories/Data/TurtleQuestText.lua
          git diff --exit-code -- SoftSpoken_Stories/Data/QuestText.lua \
            SoftSpoken_Stories/Data/Compendium.lua
          # Recalculate coverage AFTER applying stage-specific repairs.
          # The remaining 276 have existing Spoken dialogue and are not changed.
          python3 - <<'PY'
          import csv
          p="docs/audits/turtle_touched_text_coverage/review_scoped_quests.csv"
          with open(p,newline="",encoding="utf-8") as stream:
              rows=list(csv.DictReader(stream))
          with open(".audit-scoped-quest-ids","w") as stream:
              for row in rows:
                  stream.write(row["quest_id"]+"\n")
          PY
          lua5.1 scripts/export_static_quest_text_for_audit.lua \
            .audit-scoped-quest-ids .audit-static-text-hex.tsv
          python3 scripts/audit_turtle_touched_text.py \
            --turtle .audit-viewer-data/data/tortoise.sqlite \
            --vanilla "$(cat .audit-vanilla-path)" \
            --methods .audit-methods.csv \
            --vanilla-pfquest-ids .audit-pfquest-vanilla-ids.csv \
            --pfquest-overrides .audit-pfquest-overrides.csv \
            --turtle-migrations .audit-migration-text-changes.csv \
            --lua-stages .audit-static-text-hex.tsv
          python3 - <<'PY'
          import csv,json
          p="docs/audits/turtle_touched_text_coverage/"
          summary=json.load(open(p+"summary.json",encoding="utf-8"))
          with open(p+"directly_supported_text_gaps.csv",newline="",encoding="utf-8") as stream:
              rows=list(csv.DictReader(stream))
          assert summary["directly_supported_text_gaps"]==276, summary["directly_supported_text_gaps"]
          assert summary["reviewed_progress_corrections"]==3
          assert len(rows)==276 and all(r["coverage"]=="spoken_outdated_for_turtle" for r in rows)
          print("Post-import: 3 stage repairs; 13 Tier 3 completions covered; 276 Spoken conflicts remain")
          PY
          python3 -m unittest discover -s tests -p 'test_turtle_conflict_review.py'
          # The original 289-case review is retained as a historical
          # adjudication snapshot; resolved stages should not be reclassified
          # or removed from that evidentiary review. Future dynamic audits
          # start from the new 276-case gap report.
          rm -f .audit-static-text-hex.tsv .audit-scoped-quest-ids \
            .audit-methods.csv .audit-migration-text-changes.csv \
            .audit-pfquest-overrides.csv .audit-pfquest-vanilla-ids.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/audits/turtle_touched_text_coverage/ \
            SoftSpoken_Stories/Data/TurtleQuestText.lua
          if ! git diff --cached --quiet; then
            git commit -m 'Fix three Turtle progress stages and import 13 verified Tier 3 completions'
            # Rebase the validated import if the branch advanced during CI.
            # No force-push and no original Spoken text changes.
            git fetch origin audit/turtle-touched-text-coverage
            git rebase origin/audit/turtle-touched-text-coverage
            git push origin HEAD:audit/turtle-touched-text-coverage
          fi
