name: Vanilla and Turtle quest corpus cleanup

on:
  push:
    branches: [cleanup/vanilla-turtle-quest-corpus]
    paths:
      - 'SoftSpoken_Stories/**'
      - 'scripts/clean_forever_quest_data.py'
      - 'scripts/reapply_turtle_quest_catalog.py'
      - 'tests/**'
      - 'docs/forever_quest_exclusions.csv'
      - 'docs/vanilla_pfquest_ids.txt'
      - 'docs/turtle_restored_legacy_ids.csv'
      - '.github/workflows/forever-quest-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install 1.12-compatible Lua validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1

      - name: Validate exact approved exclusions and all retained data
        run: |
          python3 scripts/clean_forever_quest_data.py --check
          python3 -m unittest discover -s tests -p 'test_forever_quest_cleanup.py'
          python3 -m unittest discover -s tests -p 'test_turtle_exclusive_catalog_import.py'
          python3 tests/test_turtle_shared_id_coverage.py
          python3 scripts/reapply_turtle_quest_catalog.py --check

      - name: Prove surviving Vanilla dialogue is byte-identical to previous branch
        run: |
          mkdir -p /tmp/quest-source
          git show 6c5a79ffc28e5c52977fc14f9cdf16b376c17af4:SoftSpoken_Stories/Data/Compendium.lua > /tmp/quest-source/Compendium.lua
          git show 6c5a79ffc28e5c52977fc14f9cdf16b376c17af4:SoftSpoken_Stories/Data/QuestText.lua > /tmp/quest-source/QuestText.lua
          python3 scripts/clean_forever_quest_data.py --apply --catalog /tmp/quest-source/Compendium.lua --text /tmp/quest-source/QuestText.lua
          cmp -s /tmp/quest-source/Compendium.lua SoftSpoken_Stories/Data/Compendium.lua
          cmp -s /tmp/quest-source/QuestText.lua SoftSpoken_Stories/Data/QuestText.lua
          echo 'PASS: only reviewed quest/dialogue exclusions and their dangling chain edges changed'

      - name: Validate Lua syntax and Compendium behavior
        run: |
          luac5.1 -p SoftSpoken_Stories/Data/Compendium.lua
          luac5.1 -p SoftSpoken_Stories/Data/QuestText.lua
          luac5.1 -p SoftSpoken_Stories/Data/TurtleQuestText.lua
          lua5.1 tests/tortoise_zone_catalog.lua
          lua5.1 tests/stories_speaker_resolution.lua
          lua5.1 tests/stories_compendium_portrait_lifecycle.lua
