name: Legacy migration regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - run: |
          lua5.1 tests/legacy_migration.lua
          lua5.1 tests/unified_startup.lua
          lua5.1 tests/compendium_startup_gate.lua
          lua5.1 tests/unified_persistence.lua
          lua5.1 tests/dev_persistence.lua empty
          lua5.1 tests/dev_persistence.lua existing
          lua5.1 tests/upgrade_guard.lua
          python3 tests/test_public_contracts.py
          python3 tests/test_dev_storage_boundary.py
          python3 tests/test_persistence_lifecycle.py
