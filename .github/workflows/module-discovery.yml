name: Module discovery regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - run: |
          lua5.1 tests/module_discovery_policy.lua
          lua5.1 tests/audio_phase2_places.lua
          lua5.1 tests/places_registry_octo.lua
          lua5.1 tests/places_map_panel_names.lua
          lua5.1 tests/places_zone_portrait_emblems.lua
          lua5.1 tests/audio_phase2_writings.lua
          lua5.1 tests/writings_narrator_discovery.lua
          lua5.1 tests/writings_registry_octo.lua
          lua5.1 tests/compendium_completed_sync.lua
          lua5.1 tests/stories_quest_dialogue.lua
