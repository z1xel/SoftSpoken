name: Audio pack regression

on:
  push:
    paths:
      - "SoftSpoken/UI/Options.lua"
      - "SoftSpoken/UI/Portrait.lua"
      - "SoftSpoken/CreatureAppearance.lua"
      - "SoftSpoken/API.lua"
      - "SoftSpoken/SoundQueue.lua"
      - "SoftSpoken/SoundUtils.lua"
      - "SoftSpoken/Sources.lua"
      - "SoftSpoken/OtherSounds.lua"
      - "SoftSpoken/addon.xml"
      - "SoftSpoken/Compendium/UI/Compendium.lua"
      - "SoftSpoken/Strings.lua"
      - "SoftSpoken_Stories/Compendium/QuestsTab_112.lua"
      - "SoftSpoken_Stories/Compendium/PortraitPreload_112.lua"
      - "SoftSpoken_Stories/Compendium/QuestPage_112.lua"
      - "SoftSpoken_Stories/Player.lua"
      - "SoftSpoken_Stories/QuestOverlayUI.lua"
      - "SoftSpoken_Stories/VoiceOver.lua"
      - "SoftSpoken_Stories/FactionCrest.lua"
      - "SoftSpoken_Stories/SpeakerResolver.lua"
      - "SoftSpoken_Stories/addon.xml"
      - "SoftSpoken_Places/**"
      - "SoftSpoken_Writings/**"
      - "SoftSpoken_Stories/DataModules.lua"
      - "Data_Packs/SSS_VOFallback/**"
      - "tests/audio_pack_*.lua"
      - "tests/classicapi_portrait_compatibility.lua"
      - "tests/creature_appearance_service.lua"
      - "tests/stories_compendium_portrait_lifecycle.lua"
      - "tests/stories_portrait_preloading.lua"
      - "tests/stories_questlog_portrait_prime.lua"
      - "tests/stories_faction_crest.lua"
      - "tests/stories_speaker_resolution.lua"
      - "tests/places_zone_portrait_emblems.lua"
      - "tests/writings_narrator_discovery.lua"
      - "SoftSpoken/Textures/Zones/**"
      - ".github/workflows/audio-pack-regression.yml"
  pull_request:
    paths:
      - "SoftSpoken/UI/Options.lua"
      - "SoftSpoken/UI/Portrait.lua"
      - "SoftSpoken/CreatureAppearance.lua"
      - "SoftSpoken/API.lua"
      - "SoftSpoken/SoundQueue.lua"
      - "SoftSpoken/SoundUtils.lua"
      - "SoftSpoken/Sources.lua"
      - "SoftSpoken/OtherSounds.lua"
      - "SoftSpoken/addon.xml"
      - "SoftSpoken/Compendium/UI/Compendium.lua"
      - "SoftSpoken/Strings.lua"
      - "SoftSpoken_Stories/Compendium/QuestsTab_112.lua"
      - "SoftSpoken_Stories/Compendium/PortraitPreload_112.lua"
      - "SoftSpoken_Stories/Compendium/QuestPage_112.lua"
      - "SoftSpoken_Stories/Player.lua"
      - "SoftSpoken_Stories/QuestOverlayUI.lua"
      - "SoftSpoken_Stories/VoiceOver.lua"
      - "SoftSpoken_Stories/FactionCrest.lua"
      - "SoftSpoken_Stories/SpeakerResolver.lua"
      - "SoftSpoken_Stories/addon.xml"
      - "SoftSpoken_Places/**"
      - "SoftSpoken_Writings/**"
      - "SoftSpoken_Stories/DataModules.lua"
      - "Data_Packs/SSS_VOFallback/**"
      - "tests/audio_pack_*.lua"
      - "tests/classicapi_portrait_compatibility.lua"
      - "tests/creature_appearance_service.lua"
      - "tests/stories_compendium_portrait_lifecycle.lua"
      - "tests/stories_portrait_preloading.lua"
      - "tests/stories_questlog_portrait_prime.lua"
      - "tests/stories_faction_crest.lua"
      - "tests/stories_speaker_resolution.lua"
      - "tests/places_zone_portrait_emblems.lua"
      - "tests/writings_narrator_discovery.lua"
      - "SoftSpoken/Textures/Zones/**"
      - ".github/workflows/audio-pack-regression.yml"

jobs:
  lua51:
    name: Lua 5.1 audio pack checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Check changed addon Lua syntax
        run: |
          luac5.1 -p SoftSpoken/UI/Options.lua SoftSpoken/Strings.lua
          luac5.1 -p SoftSpoken/Compendium/UI/Compendium.lua
          luac5.1 -p SoftSpoken/UI/Portrait.lua SoftSpoken/CreatureAppearance.lua SoftSpoken/Compat.lua SoftSpoken/API.lua
          luac5.1 -p SoftSpoken_Places/Audio.lua tests/places_zone_portrait_emblems.lua
          luac5.1 -p tests/classicapi_portrait_compatibility.lua tests/creature_appearance_service.lua tests/stories_faction_crest.lua tests/stories_compendium_portrait_lifecycle.lua
          luac5.1 -p SoftSpoken_Stories/FactionCrest.lua SoftSpoken_Stories/SpeakerResolver.lua SoftSpoken_Stories/Player.lua SoftSpoken_Stories/Compendium/QuestPage_112.lua
          luac5.1 -p tests/stories_speaker_resolution.lua tests/stories_portrait_preloading.lua tests/stories_questlog_portrait_prime.lua
          luac5.1 -p SoftSpoken_Places/UI/LoreWindow.lua SoftSpoken_Writings/UI/Readables.lua
          luac5.1 -p SoftSpoken_Writings/Audio.lua SoftSpoken_Writings/DiscoveryLocations.lua tests/writings_narrator_discovery.lua
          luac5.1 -p SoftSpoken_Places/UI/Options.lua SoftSpoken_Writings/UI/Options.lua
          luac5.1 -p SoftSpoken_Stories/Compendium/QuestsTab_112.lua SoftSpoken_Stories/Compendium/PortraitPreload_112.lua SoftSpoken_Stories/DataModules.lua SoftSpoken_Stories/VoiceOver.lua SoftSpoken_Stories/QuestOverlayUI.lua
          luac5.1 -p Data_Packs/SSS_VOFallback/Module.lua
      - name: Check Writings discovery locations in narrator headings
        run: lua5.1 tests/writings_narrator_discovery.lua
      - name: Check Places narrator emblems and all upstream artwork
        run: lua5.1 tests/places_zone_portrait_emblems.lua
      - name: Check Stories faction crests and portrait fallbacks
        run: lua5.1 tests/stories_faction_crest.lua
      - name: Check Stories shared speaker resolution
        run: lua5.1 tests/stories_speaker_resolution.lua
      - name: Check Compendium portrait lifecycle
        run: lua5.1 tests/stories_compendium_portrait_lifecycle.lua
      - name: Check bounded Stories portrait preloading
        run: lua5.1 tests/stories_portrait_preloading.lua
      - name: Check quest-log portrait preloading and retry
        run: lua5.1 tests/stories_questlog_portrait_prime.lua
      - name: Check shared creature appearance service
        run: lua5.1 tests/creature_appearance_service.lua
      - name: Check ClassicAPI portrait version compatibility
        run: lua5.1 tests/classicapi_portrait_compatibility.lua
      - name: Check official pack priority and fallback
        run: lua5.1 tests/audio_pack_priority_guardrails.lua
      - name: Check legacy and current voice pack registries
        run: lua5.1 tests/audio_pack_registry_compatibility.lua

      # TEMPORARY AUDIO INTEGRATION: run the merged main's full audio transport
      # suite here because its standalone push workflow targets main only.
      - name: Check full audio API suite with portrait integration
        run: |
          set -e
          for test in \
            tests/audio_soundutils.lua \
            tests/audio_queue.lua \
            tests/audio_progress_ui.lua \
            tests/audio_phase2_places.lua \
            tests/audio_phase2_writings.lua \
            tests/audio_phase2_writings_queue.lua \
            tests/audio_phase2_diagnostics.lua \
            tests/audio_phase2_routing.lua \
            tests/audio_phase2_ducking.lua \
            tests/audio_phase3_pack_selection.lua; do
            echo "Testing ${test}"
            lua5.1 "$test"
          done
          python3 -m py_compile scripts/audio_pack_audit.py
          python3 scripts/audio_pack_audit.py --help >/dev/null
          python3 -m unittest discover -s tests -p test_audio_pack_audit.py -v
