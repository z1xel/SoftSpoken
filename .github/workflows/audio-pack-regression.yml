name: Audio pack regression

on:
  push:
    paths:
      - "SoftSpoken/UI/Options.lua"
      - "SoftSpoken/Strings.lua"
      - "SoftSpoken_Stories/Compendium/QuestsTab_112.lua"
      - "SoftSpoken_Places/**"
      - "SoftSpoken_Writings/**"
      - "SoftSpoken_Stories/DataModules.lua"
      - "Data_Packs/SSS_VOFallback/**"
      - "tests/audio_pack_*.lua"
      - ".github/workflows/audio-pack-regression.yml"
  pull_request:
    paths:
      - "SoftSpoken/UI/Options.lua"
      - "SoftSpoken/Strings.lua"
      - "SoftSpoken_Stories/Compendium/QuestsTab_112.lua"
      - "SoftSpoken_Places/**"
      - "SoftSpoken_Writings/**"
      - "SoftSpoken_Stories/DataModules.lua"
      - "Data_Packs/SSS_VOFallback/**"
      - "tests/audio_pack_*.lua"
      - ".github/workflows/audio-pack-regression.yml"

jobs:
  lua51:
    name: Lua 5.1 audio pack checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Check changed addon Lua syntax
        run: |
          luac5.1 -p SoftSpoken/UI/Options.lua SoftSpoken/Strings.lua
          luac5.1 -p SoftSpoken_Places/UI/LoreWindow.lua SoftSpoken_Writings/UI/Readables.lua
          luac5.1 -p SoftSpoken_Stories/Compendium/QuestsTab_112.lua SoftSpoken_Stories/DataModules.lua
          luac5.1 -p Data_Packs/SSS_VOFallback/Module.lua
      - name: Check official pack priority and fallback
        run: lua5.1 tests/audio_pack_priority_guardrails.lua
      - name: Check legacy and current voice pack registries
        run: lua5.1 tests/audio_pack_registry_compatibility.lua
