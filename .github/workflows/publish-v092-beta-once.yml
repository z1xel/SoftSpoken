name: Publish SoftSpoken v0.9.2-beta (one time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v092-beta-once.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-v092-beta-once
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: z1xel/SoftSpoken
      TAG: v0.9.2-beta
      TARGET: 5b6a519e797467e50a9fa717836cc623dd884ee9
      STAGE_RUN: '46125230177'
      ARTIFACT_ID: '15255655772'
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned source and successful staging
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$TARGET" || {
            # Shallow checkout: verify parent through GitHub instead.
            test "$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq '.parents[0].sha')" = "$TARGET"
          }
          test "$(cat VERSION)" = "$TAG"
          gh api "repos/$GH_REPO/actions/runs/$STAGE_RUN" | jq -e --arg sha "$TARGET" '.head_sha == $sha and .head_branch == "main" and .conclusion == "success"' >/dev/null
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID" | jq -e --arg sha "$TARGET" '.workflow_run.head_sha == $sha and .expired == false and .name == "SoftSpoken-v0.9.2-beta-preview" and .digest == "sha256:471118dab06ed5f8cd1ac0ce6466f33b8df5b3f52754f06e1d78e3f556e3130d"' >/dev/null
          test "$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" --jq 'length')" = 0
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing release."
            exit 1
          fi
      - name: Download and validate exact staged archive
        run: |
          set -euo pipefail
          mkdir -p dist
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/staged-artifact.zip
          echo "471118dab06ed5f8cd1ac0ce6466f33b8df5b3f52754f06e1d78e3f556e3130d  /tmp/staged-artifact.zip" | sha256sum -c -
          python3 - <<'PY'
          import pathlib, zipfile
          p=pathlib.Path("dist/SoftSpoken-v0.9.2-beta.zip")
          with zipfile.ZipFile("/tmp/staged-artifact.zip") as z:
              assert z.namelist() == [p.name], z.namelist()
              p.write_bytes(z.read(p.name))
          assert p.stat().st_size == 137674095
          mods={"SoftSpoken","SoftSpoken_Stories","SoftSpoken_Places","SoftSpoken_Writings"}
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              files=z.namelist()
              assert len(files)==1143
              assert {n.split("/")[0] for n in files}==mods
              for m in mods:
                  assert b"## Version: v0.9.2-beta" in z.read(f"{m}/{m}.toc")
          print("Validated exact staged archive:",p,p.stat().st_size)
          PY
          sha256sum dist/SoftSpoken-v0.9.2-beta.zip
      - name: Publish verified archive and changelog
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" --jq 'length')" = 0
          gh release create "$TAG" "dist/SoftSpoken-v0.9.2-beta.zip" --target "$TARGET" --title "SoftSpoken v0.9.2-beta" --notes-file docs/releases/v0.9.2-beta.md --latest
          gh release view "$TAG" --json url,tagName,isDraft,isPrerelease,assets
