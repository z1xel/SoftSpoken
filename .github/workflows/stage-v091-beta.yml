name: Stage SoftSpoken v0.9.1-beta

# Builds a private-to-Actions candidate ZIP; does NOT publish a GitHub release.
on:
  push:
    branches: [dev]
    paths:
      - "VERSION"
      - "README.md"
      - "SoftSpoken/**"
      - "tests/test_release_version.py"
      - "tests/test_public_contracts.py"
      - "tests/test_ui_packaging.py"
      - "tests/test_texture_path_integrity.py"
      - ".github/workflows/stage-v091-beta.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    name: Validate and package v0.9.1-beta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version consistency and installable file structure
        run: |
          python3 tests/test_release_version.py
          python3 tests/test_public_contracts.py
          python3 tests/test_ui_packaging.py
          python3 tests/test_texture_path_integrity.py
      - name: Build installable ZIP without development files
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          modules = ("SoftSpoken",)
          version = pathlib.Path("VERSION").read_text().strip()
          package = pathlib.Path("dist") / ("SoftSpoken-" + version + ".zip")
          package.parent.mkdir(exist_ok=True)
          files = sorted(p for mod in modules for p in pathlib.Path(mod).rglob("*") if p.is_file())
          assert files
          with zipfile.ZipFile(package, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for file in files:
                  assert not file.is_symlink()
                  z.write(file, file.as_posix())
          with zipfile.ZipFile(package) as z:
              assert z.testzip() is None
              assert len(z.namelist()) == len(files)
              assert all(name.startswith("SoftSpoken/") for name in z.namelist())
              assert [name for name in z.namelist() if name.lower().endswith(".toc")] == ["SoftSpoken/SoftSpoken.toc"]
              for mod in modules:
                  toc = f"{mod}/{mod}.toc"
                  assert f"## Version: {version}".encode() in z.read(toc)
          print(f"Staged {package} ({len(files)} files, {package.stat().st_size:,} bytes)")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SoftSpoken-v0.9.1-beta-preview
          path: dist/SoftSpoken-v0.9.1-beta.zip
          compression-level: 0
