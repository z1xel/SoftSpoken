name: Location generation regression
on:
  push:
    paths:
      - 'tools/locations/**'
      - 'SoftSpoken/Modules/**/Data/**'
      - 'SoftSpoken/Compendium/UI/*Names.lua'
      - '.github/workflows/location-generation.yml'
  pull_request:
    paths:
      - 'tools/locations/**'
      - 'SoftSpoken/Modules/**/Data/**'
      - 'SoftSpoken/Compendium/UI/*Names.lua'
      - '.github/workflows/location-generation.yml'
  workflow_dispatch:
jobs:
  locations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tools/locations -p 'test_*.py' -v
      - run: python tools/locations/build.py --inventory-only --output /tmp/location-inventory
      - run: python tools/locations/build.py --seed-only --manifest tools/locations/sources.json --decisions tools/locations/decisions.json --output /tmp/location-seed
      - uses: actions/upload-artifact@v4
        with:
          name: location-audit-inputs
          path: |
            tools/locations/
            SoftSpoken/Modules/Stories/Data/TurtleAreaMeta.lua
            /tmp/location-inventory/content-inventory.json
          retention-days: 3
