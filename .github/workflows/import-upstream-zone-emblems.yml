# Temporary one-time binary import: fetch pinned upstream art and commit its
# exact bytes to this PR branch. The workflow is removed after a successful run.
name: Import missing upstream zone emblems
on:
  push:
    branches: [feature/classicapi-model-compat]
    paths: [".github/workflows/import-upstream-zone-emblems.yml"]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify upstream TGA images
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import urllib.request

          source = "https://raw.githubusercontent.com/rusty-key/spoken-wow/59a3445d70346b69815efa8cec5f21156dc4d144/addons/Spoken/Textures/Zones/"
          expected = {
            "AlteracValley.tga": "536fd820426d562872f0a9353470ef0bdbd1f800",
            "ArathiBasin.tga": "91a2df1ad44ba3e30cbeef0c4ff8d1b19b089e51",
            "Darnassus.tga": "60953ac7c941597fe7828d60177c30c987b6ea51",
            "Ironforge.tga": "3f6448f80a42186aa96717a116b2dd84fecc8c19",
            "Moonglade.tga": "a5b55c56a38a74f7ce2a9d386b2a6f35228f8a46",
            "Orgrimmar.tga": "a2c9f21f1019b248d84c8c6a12c5a17579395e17",
            "Stormwind.tga": "a8b6ac9f6ef83e8e7064007777fb03b76b9b6cfd",
            "ThunderBluff.tga": "0fb8253ef8e0583838ad325777e932377fc7080a",
            "Undercity.tga": "931b1757ef503ccb9f103a6ff415324169b1f27e",
            "WarsongGulch.tga": "972325708abec8e1e19c7392987646914a7f3dfc",
          }
          target = pathlib.Path("SoftSpoken/Textures/Zones")
          target.mkdir(parents=True, exist_ok=True)
          for name, sha in sorted(expected.items()):
              path = target / name
              if path.exists():
                  data = path.read_bytes()
              else:
                  with urllib.request.urlopen(source + name, timeout=30) as response:
                      data = response.read()
              actual = hashlib.sha1(("blob %d\0" % len(data)).encode() + data).hexdigest()
              if actual != sha:
                  raise SystemExit("Upstream integrity mismatch: %s: %s" % (name, actual))
              if not path.exists():
                  path.write_bytes(data)
              print(name, len(data), sha)
          PY
      - name: Commit verified artwork to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- SoftSpoken/Textures/Zones
          if ! git diff --cached --quiet; then
            git commit -m "Bundle remaining 10 upstream zone and city emblems"
            git push origin HEAD:feature/classicapi-model-compat
          fi
