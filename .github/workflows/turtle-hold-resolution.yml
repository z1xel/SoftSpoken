name: Turtle held quest classification and dialogue adjudication
on:
  push:
    branches: [audit/turtle-touched-text-coverage]
    paths:
      - .github/workflows/turtle-hold-resolution.yml
      - scripts/audit_turtle_hold_resolutions.py
      - scripts/import_turtle_approved_alias.py
      - scripts/reapply_turtle_zone_exception.py
      - docs/turtle_older_zone_recoveries.csv
      - scripts/import_tortoise_quest_dialogue.mjs
      - docs/audits/turtle_hold_resolution/approved_41797_identity.json
      - tests/test_turtle_held_quest_alias.py
      - tests/test_turtle_exclusive_catalog_import.py
      - docs/audits/tortoise_zone_overlay/holds.csv
      - docs/audits/turtle_touched_text_coverage/held_quests.csv
      - docs/audits/tortoise_quest_overlay/summary.json
  workflow_dispatch:
concurrency:
  group: turtle-held-quest-audit
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  audit-held-quests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
      - name: Fetch immutable Turtle source
        uses: actions/checkout@v4
        with:
          repository: Xian55/tortoise-db-viewer
          ref: 567ce23c73087e9b67fd2d4732c171d751e54bba
          path: .hold-source
          sparse-checkout: |
            data/tortoise.sqlite.br
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify and decode Turtle database
        run: |
          node - <<'JS'
          const fs = require('fs'), zlib = require('zlib'), crypto = require('crypto');
          const input = fs.readFileSync('.hold-source/data/tortoise.sqlite.br');
          const sha = crypto.createHash('sha1')
            .update(Buffer.from('blob '+input.length+'\0')).update(input)
            .digest('hex');
          if (sha !== '7b126fce5260502fa40f9f6b67190f920e60a0f6')
            throw Error('Pinned Tortoise source changed: '+sha);
          const db = zlib.brotliDecompressSync(input);
          if (db.subarray(0,16).toString('latin1') !== 'SQLite format 3\0')
            throw Error('Invalid decompressed Turtle SQLite');
          fs.writeFileSync('.hold-source/data/tortoise.sqlite',db);
          JS
      - name: Resolve source-backed holds without altering gameplay data
        run: |
          python3 scripts/audit_turtle_hold_resolutions.py \
            --turtle .hold-source/data/tortoise.sqlite
          python3 - <<'PY'
          import csv,json,pathlib
          root=pathlib.Path('docs/audits/turtle_hold_resolution')
          summary=json.loads((root/'summary.json').read_text())
          assert summary['original_zone_holds']==37
          assert summary['original_shared_text_holds']==49
          assert summary['original_exclusive_text_holds']==8
          assert summary['direct_text_import_approved']==[41797]
          assert summary['direct_zone_classification_approved']==[708,3366,41797]
          for name,n in [('zone_37_resolution.csv',37),('shared_49_resolution.csv',49),
                         ('exclusive_8_resolution.csv',8)]:
              with (root/name).open(newline='',encoding='utf-8') as f:
                  assert len(list(csv.DictReader(f)))==n
          print('All held cohorts validated; Northwind, Badlands, Wailing Caverns classifications approved')
          PY
      - name: Test and import ONLY the source-fingerprinted quest 41797 alias
        run: |
          python3 -m unittest discover -s tests -p 'test_turtle_held_quest_alias.py'
          python3 -m unittest discover -s tests -p 'test_turtle_exclusive_catalog_import.py'
          python3 scripts/reapply_turtle_zone_exception.py --check
          python3 scripts/import_turtle_approved_alias.py \
            --db .hold-source/data/tortoise.sqlite
          python3 scripts/import_turtle_approved_alias.py \
            --db .hold-source/data/tortoise.sqlite \
            --write
          sha256sum SoftSpoken_Stories/Data/TurtleQuestText.lua > /tmp/hold-alias-lua.sha
          python3 scripts/import_turtle_approved_alias.py \
            --db .hold-source/data/tortoise.sqlite \
            --write
          sha256sum -c /tmp/hold-alias-lua.sha
          python3 - <<'PY'
          import pathlib,re
          p=pathlib.Path("SoftSpoken_Stories/Data/TurtleQuestText.lua")
          s=p.read_text(encoding="utf-8")
          assert s.count("-- BEGIN verified Turtle title alias quest 41797")==1
          assert len(re.findall(r"(?m)^    (?:accept|progress|complete) = ",s.split("-- BEGIN verified Turtle title alias quest 41797")[-1]))==3
          assert s.count("SSCTurtleQuestText[41797] = {")==1
          for qid in (40128,40129,40132,41098,41100,41103,41105):
              assert "SSCTurtleQuestText["+str(qid)+"]" not in s
          assert "SSCTurtleQuestText[41105]" not in s
          assert "SSCTurtleQuestText[9034].complete" in s
          print("41797 imported without restoring seven deprecated title-conflict quests")
          PY
          git diff --exit-code -- SoftSpoken_Stories/Data/QuestText.lua

      - name: Check atomic incremental and full source regeneration
        run: |
          sha256sum SoftSpoken_Stories/Data/TurtleQuestText.lua > /tmp/held-quest-original.sha
          node scripts/import_tortoise_quest_dialogue.mjs --touched-only \
            --source-sqlite .hold-source/data/tortoise.sqlite
          sha256sum -c /tmp/held-quest-original.sha
          node scripts/import_tortoise_quest_dialogue.mjs \
            --source-sqlite .hold-source/data/tortoise.sqlite
          sha256sum -c /tmp/held-quest-original.sha
          git diff --exit-code -- SoftSpoken_Stories/Data/QuestText.lua
          echo 'PASS: both regeneration modes preserve every Turtle text byte'

      - name: Commit source evidence and the single approved quest dialogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/audits/turtle_hold_resolution/ \
            SoftSpoken_Stories/Data/TurtleQuestText.lua
          if ! git diff --cached --quiet; then
            git commit -m 'Resolve Turtle holds and add verified 41797 title-aliased dialogue'
            git fetch origin audit/turtle-touched-text-coverage
            git rebase origin/audit/turtle-touched-text-coverage
            git push origin HEAD:audit/turtle-touched-text-coverage
          fi
