name: Audio API transport regression

on:
  push:
    branches:
      - development/audio-api
    paths:
      - "SoftSpoken/SoundUtils.lua"
      - "SoftSpoken/SoundQueue.lua"
      - "tests/audio_soundutils.lua"
      - "tests/audio_queue.lua"
      - "tests/audio_progress_ui.lua"
      - "tests/audio_phase2_places.lua"
      - "tests/audio_phase2_writings.lua"
      - "SoftSpoken_Writings/Audio.lua"
      - "SoftSpoken_Writings/Events.lua"
      - "SoftSpoken_Places/Autoplay.lua"
      - "SoftSpoken_Places/Audio.lua"
      - "SoftSpoken_Places/Settings.lua"
      - "SoftSpoken_Places/UI/Options.lua"
      - "SoftSpoken_Places/Core.lua"
      - ".github/workflows/audio-api-regression.yml"
  pull_request:
    paths:
      - "SoftSpoken/SoundUtils.lua"
      - "SoftSpoken/SoundQueue.lua"
      - "tests/audio_soundutils.lua"
      - "tests/audio_queue.lua"
      - "tests/audio_progress_ui.lua"
      - "tests/audio_phase2_places.lua"
      - "tests/audio_phase2_writings.lua"
      - "SoftSpoken_Writings/Audio.lua"
      - "SoftSpoken_Writings/Events.lua"
      - "SoftSpoken_Places/Autoplay.lua"
      - "SoftSpoken_Places/Audio.lua"
      - "SoftSpoken_Places/Settings.lua"
      - "SoftSpoken_Places/UI/Options.lua"
      - "SoftSpoken_Places/Core.lua"
      - ".github/workflows/audio-api-regression.yml"

permissions:
  contents: read

jobs:
  sound-utils-lua51:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Run ClassicAPI mock playback tests
        run: lua5.1 tests/audio_soundutils.lua
      - name: Run engine-driven queue and lifecycle tests
        run: lua5.1 tests/audio_queue.lua
      - name: Run estimated progress and Vanilla UI tests
        run: lua5.1 tests/audio_progress_ui.lua
      - name: Run Places combat, setting migration and startup tests
        run: lua5.1 tests/audio_phase2_places.lua
      - name: Run Writings page and interruption tests
        run: lua5.1 tests/audio_phase2_writings.lua
